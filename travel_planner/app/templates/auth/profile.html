{% extends "base.html" %}

{% block title %}个人资料 - AI 旅游行程规划助手{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-lg-6 offset-lg-3">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="card-title">
                        <i class="fas fa-user-circle me-2"></i>个人资料
                    </h4>
                </div>
                <div class="card-body">
                    <!-- 用户头像 -->
                    <div class="text-center mb-4">
                        <div class="w-20 h-20 mx-auto bg-primary rounded-full flex items-center justify-center">
                            <i class="fas fa-user text-white fa-3x"></i>
                        </div>
                        <p class="mt-2 text-muted">{{ current_user.username }}</p>
                    </div>

                    <!-- 基本信息表单 -->
                    <form method="POST" enctype="multipart/form-data">
                        {{ form.hidden_tag() }}
                        
                        <div class="mb-3">
                            <label class="form-label">用户名</label>
                            <input type="text" class="form-control" name="username" value="{{ form.username.data }}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">邮箱</label>
                            <input type="email" class="form-control" name="email" value="{{ form.email.data }}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">个人简介</label>
                            <textarea class="form-control" name="bio" rows="3">{{ form.bio.data or '' }}</textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">兴趣标签</label>
                            <select class="form-control" name="preference_tags" multiple>
                                {% for tag in ['美食', '历史', '自然', '都市', '海滨', '文化', '购物', '运动'] %}
                                <option value="{{ tag }}" {% if tag in (current_user.get_preference_tags() or []) %}selected{% endif %}>
                                    {{ tag }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fas fa-save me-1"></i>保存修改
                        </button>
                    </form>
                </div>
            </div>

            <!-- 修改密码 -->
            <div class="card shadow-sm mt-4">
                <div class="card-header bg-secondary text-white">
                    <h4 class="card-title">
                        <i class="fas fa-lock me-2"></i>修改密码
                    </h4>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('auth.change_password') }}">
                        {{ password_form.hidden_tag() }}
                        
                        <div class="mb-3">
                            <label class="form-label">原密码</label>
                            <input type="password" class="form-control" name="old_password" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">新密码</label>
                            <input type="password" class="form-control" name="new_password" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">确认新密码</label>
                            <input type="password" class="form-control" name="new_password2" required>
                        </div>
                        
                        <button type="submit" class="btn btn-secondary w-100">
                            <i class="fas fa-key me-1"></i>修改密码
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
